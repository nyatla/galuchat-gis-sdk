<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Galuchat JS Reverse Geocoding Demo</title>
    <style>
      body {
        box-sizing: border-box;
        max-width: 760px;
        margin: 32px auto;
        padding: 0 16px;
        color: #1f2933;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.6;
      }

      code,
      pre {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      form {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 12px;
        align-items: end;
        margin: 20px 0;
        padding: 16px;
        border: 1px solid #d8e0e8;
        border-radius: 8px;
        background: #f8fafc;
      }

      label {
        display: grid;
        gap: 4px;
        font-weight: 600;
      }

      input,
      button {
        box-sizing: border-box;
        min-height: 38px;
        padding: 8px 10px;
        border: 1px solid #b6c2cf;
        border-radius: 6px;
        font: inherit;
      }

      button {
        color: white;
        border-color: #2563eb;
        background: #2563eb;
        cursor: pointer;
      }

      button:disabled {
        border-color: #94a3b8;
        background: #94a3b8;
        cursor: wait;
      }

      .result {
        padding: 16px;
        border: 1px solid #d8e0e8;
        border-radius: 8px;
      }

      .name {
        margin: 0;
        font-size: 1.35rem;
        font-weight: 700;
      }

      .muted {
        color: #607083;
      }

      .error {
        color: #b42318;
      }

      .debug-panel {
        margin-top: 16px;
        border-radius: 8px;
        background: #111827;
        color: #d1d5db;
      }

      .debug-panel summary {
        padding: 10px 12px;
        cursor: pointer;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 13px;
      }

      .debug-panel pre {
        overflow: auto;
        max-height: 280px;
        margin: 0;
        padding: 12px;
        border-top: 1px solid #374151;
        color: #d1d5db;
        background: #111827;
        font-size: 12px;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <h1>Galuchat JS 逆ジオコーディング</h1>
    <p>
      <code>N03-20240101</code> の <code>WGSMapSet/3</code> と <code>GisWordBook</code> を読み込み、
      経度・緯度から行政区域名を表示します。
    </p>

    <form id="query-form">
      <label>
        経度 lon
        <input id="lon" name="lon" type="number" step="0.000001" value="140.0267" required>
      </label>
      <label>
        緯度 lat
        <input id="lat" name="lat" type="number" step="0.000001" value="35.6810" required>
      </label>
      <button id="submit" type="submit" disabled>読み込み中...</button>
    </form>

    <p class="muted">
      例:
      <button type="button" class="sample" data-lon="140.0267" data-lat="35.6810">習志野市付近</button>
      <button type="button" class="sample" data-lon="139.7671" data-lat="35.6812">東京駅</button>
      <button type="button" class="sample" data-lon="135.7681" data-lat="35.0116">京都市役所付近</button>
    </p>

    <section class="result" aria-live="polite">
      <p id="name" class="name">初期化中...</p>
      <details class="debug-panel">
        <summary>Debug Console</summary>
        <pre id="details"></pre>
      </details>
    </section>

    <script src="../../galuchat.min.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
